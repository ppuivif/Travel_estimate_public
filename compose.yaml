services:
  database:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: travel_estimate
      MARIADB_USER: travel
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
volumes:
  mariadb_data:
